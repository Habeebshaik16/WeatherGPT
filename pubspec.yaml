
name: weathergpt
description: "A Flutter weather application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  speech_to_text: ^7.5.0
  audioplayers: ^6.5.1
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  web: ^1.1.1
  flutter_local_notifications: 19.5.0

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/backgrounds/
    - assets/icon/weather_gpt_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/weather_gpt_icon.png"
  min_sdk_android: 21
